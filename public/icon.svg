<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d113a" />
      <stop offset="60%" stop-color="#0e0722" />
      <stop offset="100%" stop-color="#070312" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonFuchsia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="orbitFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="coreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#d946ef" stroke-opacity="0.3" stroke-width="4" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#7928ca" opacity="0.18" filter="url(#neonGold)" />
  <circle cx="256" cy="256" r="90" fill="#06b6d4" opacity="0.15" filter="url(#neonCyan)" />

  <!-- Orbit 1: Angled 35deg (Cyan) -->
  <ellipse cx="256" cy="256" rx="170" ry="60" fill="none" stroke="url(#orbitCyan)" stroke-width="8" transform="rotate(-35 256 256)" filter="url(#neonCyan)" opacity="0.9" />
  <circle cx="115" cy="155" r="9" fill="#22d3ee" filter="url(#neonCyan)" />
  <circle cx="397" cy="357" r="9" fill="#22d3ee" filter="url(#neonCyan)" />

  <!-- Orbit 2: Angled +35deg (Fuchsia) -->
  <ellipse cx="256" cy="256" rx="170" ry="60" fill="none" stroke="url(#orbitFuchsia)" stroke-width="8" transform="rotate(35 256 256)" filter="url(#neonFuchsia)" opacity="0.9" />
  <circle cx="397" cy="155" r="9" fill="#f472b6" filter="url(#neonFuchsia)" />
  <circle cx="115" cy="357" r="9" fill="#f472b6" filter="url(#neonFuchsia)" />

  <!-- Orbit 3: Horizontal (Amber / Gold) -->
  <ellipse cx="256" cy="256" rx="175" ry="55" fill="none" stroke="url(#coreGold)" stroke-width="5" stroke-dasharray="10 8" opacity="0.6" />

  <!-- Glowing Central Core -->
  <circle cx="256" cy="256" r="46" fill="url(#coreGold)" filter="url(#neonGold)" />
  <circle cx="256" cy="256" r="38" fill="#fffbeb" opacity="0.95" />

  <!-- Stylized Lab 'E' / Quantum Atom Spark in Center -->
  <path d="M236 230 L276 230 M236 230 L236 282 L276 282 M236 256 L268 256" stroke="#92400e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkle Accent Stars -->
  <polygon points="256,192 260,206 274,210 260,214 256,228 252,214 238,210 252,206" fill="#fde68a" />
  <polygon points="200,285 203,295 213,298 203,301 200,311 197,301 187,298 197,295" fill="#38bdf8" />
  <polygon points="312,285 315,295 325,298 315,301 312,311 309,301 299,298 309,295" fill="#f472b6" />
</svg>
